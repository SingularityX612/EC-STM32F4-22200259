; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = .
include_dir = include

# Default environment setting
[env]
platform = ststm32
board = nucleo_f411re
framework = cmsis
debug_tool = stlink
build_flags = -Wl,-u,_printf_float,-u,_scanf_float -std=c11 -O3



##################################################################
# User-Defined Environment   
##################################################################
#
# For example: LAB GPIO
#[env:LAB_GPIO]
#build_src_filter = +<lab/LAB_GPIO_DIO_LED/LAB_GPIO_DIO_LED.c> +<include/*.c>

# You can add new environments
[env:TU_CreateProject_Example1]
build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example1_main.c> +<include/*.c>

[env:TU_GPIO_Digital_Out_LED]
build_src_filter = +<tutorial/TU_GPIO_Digital_Out_LED_22200259.c> +<include/*.c>
# You can add more new environments
#[env:TU_CreateProject_Example2]
#build_src_filter = +<tutorial/TU_CreateProject_VSC/TU_CreateProject_Example2_main.c> +<include/*.c>

[env:TU_GPIO_Digital_InOut_Button]
build_src_filter = +<tutorial/TU_GPIO_Digital_InOut_Button_22200259.c> +<include/*.c> -<include/ecSTM32_simple.c>

[env:Lab_GPIO_DIO_LED_Photosensor]
build_src_filter = +<lab/LAB_GPIO_InOut/LAB_GPIO_DIO_LED_Photosensor.c> +<include/*.c>

[env:Lab_GPIO_DIO_multiLED]
build_src_filter = +<lab/LAB_GPIO_InOut/LAB_GPIO_DIO_multiLED.c> +<include/*.c>

[env:TU_GPIO_7segment]
build_src_filter = +<tutorial/TU_GPIO_7segment.c> +<include/*.c>

[env:TU_SysTick]
build_src_filter = +<tutorial/TU_SysTick.c> +<include/*.c>

[env:TU_USART1]
build_src_filter = +<tutorial/TU_USART/TU_USART1.c> +<include/*.c>

[env:TU_USART2]
build_src_filter = +<tutorial/TU_USART/TU_USART2.c> +<include/*.c>

[env:Lab_GPIO_7segment]
build_src_filter = +<lab/LAB_GPIO_7segment/LAB_GPIO_7segment.c> +<include/*.c>

[env:Lab_GPIO_7segment_counter]
build_src_filter = +<lab/LAB_GPIO_7segment/LAB_GPIO_7segment_counter.c> +<include/*.c>   

[env:Lab_GPIO_7segment_counter_challange]
build_src_filter = +<lab/LAB_GPIO_7segment/LAB_GPIO_7segment_counter_challange.c> +<include/*.c>

[env:PreLAB_EXTI]
build_src_filter = +<lab/PreLAB_EXTI/PreLAB_EXTI_22200259.c> +<include/*.c>

[env:LAB_EXTI]
build_src_filter = +<lab/LAB_EXTI/LAB_EXTI_22200259.c> +<include/*.c>

[env:LAB_Stepper_Motor]
build_src_filter = +<lab/LAB_Stepper_Motor/LAB_Stepper_Motor_22200259.c> +<include/*.c>
